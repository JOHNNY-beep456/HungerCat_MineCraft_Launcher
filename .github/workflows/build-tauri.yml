name: build-tauri

# 全平台安装包统一在这里构建：Windows（x64 / x86 / arm64）、Linux（x86_64 / aarch64 / armv7l）、
# macOS（x86_64 / aarch64）。Windows 之所在放在托管运行器上，是因为本机只能出 x64：
# x86 / arm64 需要对应的 MSVC 库目录，arm64 还要 clang 给 ring 编汇编。
#
# 触发：手动 workflow_dispatch，或推送 v* 标签（打标签时额外创建 Draft Release 并附上全部产物）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # msvc 是 ilammy/msvc-dev-cmd 的 arch 参数：
          #   x64   → 本机工具链 + x64 库
          #   x86   → 32 位工具链 + x86 库（不是 amd64_x86：LIB 必须指向 x86）
          #   amd64_arm64 → x64 宿主工具 + ARM64 库（交叉）
          - arch: x64
            target: x86_64-pc-windows-msvc
            msvc: x64
          - arch: x86
            target: i686-pc-windows-msvc
            msvc: x86
          - arch: arm64
            target: aarch64-pc-windows-msvc
            msvc: amd64_arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 让 link.exe / LIB / INCLUDE 指向目标架构。缺了这一步，x86 会去链 x64 的
      # kernel32.lib，arm64 则直接报找不到库。
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      # ring 的 arm64 分支会自己去找 clang；托管镜像自带 LLVM，只是不在 PATH 上。
      - name: 把 LLVM 加进 PATH（arm64 需要）
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          if (Test-Path 'C:\Program Files\LLVM\bin') {
            'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          } else {
            Write-Error 'LLVM not found; aarch64 ring build needs clang'
          }

      - run: npm ci

      # tauri.conf.json 的 beforeBuildCommand 会自行执行 npm run build:tauri:web。
      # 显式给 --target，产物落在 target/<triple>/release 下。
      - name: 构建 NSIS(.exe) + MSI
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis,msi

      # Tauri 没有 MSIX 目标，用 Windows SDK 的 makeappx 单独封装；
      # 结构（exe + easytier/ + Assets + AppxManifest）与 NSIS 安装后的文件一致。
      - name: 封装 MSIX
        shell: pwsh
        run: |
          $v = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          ./scripts/package-msix.ps1 `
            -Arch '${{ matrix.arch }}' `
            -Version $v `
            -ExeDir "src-tauri/target/${{ matrix.target }}/release" `
            -OutDir 'dist-msix' `
            -Sign

      - uses: actions/upload-artifact@v4
        with:
          name: hcmcl-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            dist-msix/*.msix
            dist-msix/*.cer

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 公开仓库可用的 arm64 托管运行器；若账号不可用会在此 job 失败，不影响 x64。
          - runner: ubuntu-22.04
            arch: x86_64
            bundles: deb,appimage
          - runner: ubuntu-24.04-arm
            arch: aarch64
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tauri.conf.json 的 beforeBuildCommand 会自行执行 npm run build:tauri:web。
      - name: 构建安装包
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: hcmcl-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  linux-armv7:
    name: Linux (armv7l)
    # 托管运行器没有 armv7 硬件，也没有可用的 armv7 docker 镜像里的完整工具链，
    # 只能在 x64 上装 armhf 依赖做交叉编译。只出 .deb：
    # AppImage 依赖架构相关的 linuxdeploy / FUSE 运行时，交叉打包不成立。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 官方 amd64 源不提供 armhf 索引，必须显式标注架构并挂 ports 源，
      # 否则 apt 会把 armhf 当成「本地没有该架构」而静默跳过。
      - name: 准备 armhf 交叉环境
        run: |
          sudo dpkg --add-architecture armhf
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo tee /etc/apt/sources.list.d/armhf-ports.list >/dev/null <<'EOF'
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf \
            pkg-config file patchelf \
            libwebkit2gtk-4.1-dev:armhf libgtk-3-dev:armhf librsvg2-dev:armhf \
            libayatana-appindicator3-dev:armhf libxdo-dev:armhf libssl-dev:armhf libdbus-1-dev:armhf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 交叉构建 deb
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
          PKG_CONFIG_ALLOW_CROSS: '1'
          # 只搜 armhf 与架构无关的 .pc，避免把宿主 x64 的 GTK 头文件混进来
          PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
        run: npx tauri build --target armv7-unknown-linux-gnueabihf --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: hcmcl-linux-armv7l
          if-no-files-found: error
          path: src-tauri/target/armv7-unknown-linux-gnueabihf/release/bundle/deb/*.deb

  macos:
    name: macOS (x86_64 + aarch64)
    # 本仓库拿不到 macOS arm64 托管运行器（macos-14 会报
    # "configuration 'macos-14-arm64-us-default' is not supported"），
    # macos-13 已退役排队不动，因此固定在 Intel 运行器上交叉编译两个 target。
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # 未签名：用户首次打开需右键 →「打开」。公证需要 Apple 开发者证书，不在本仓库范围。
      - name: 构建 x86_64（dmg）
        run: npx tauri build --target x86_64-apple-darwin --bundles app,dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 构建 aarch64（dmg）
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: hcmcl-macos-x86_64
          if-no-files-found: error
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: hcmcl-macos-aarch64
          if-no-files-found: error
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  release:
    name: 汇总到 Draft Release
    needs: [windows, linux, linux-armv7, macos]
    # always()：armv7 交叉编译依赖 ports 源的包，历史上没跑过；某个架构失败时
    # 仍要把已成功的产物汇总成草稿，发布前人工核对缺了哪一项。
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**
          body: |
            ## 更新日志

            ### 新增
            - **自定义背景色**（设置 → 通用 → 自定义背景色）：可选 1 / 2 / 3 种颜色 ——
              1 种为纯色，2 种为渐变并可选择纵向 / 横向 / 斜向，3 种为三色渐变，带实时预览。
              仅在背景色真正生效时可调：界面主题固定了背景、已设置自定义壁纸、或处于极简模式时，
              子控件会置灰并写明原因（总开关仍可关闭）。

            ### 变更
            - **启动检查移入载入界面**：主页安全联网核对改为在载入遮罩里完成（最长 3 秒）再露出界面，
              遮罩上显示当前步骤。超过 3 秒会先放行，检查在后台继续。
            - 点任一背景预设会自动关闭自定义背景色，回到预设。

            ### 性能
            - 首帧静态启动骨架，样式表解析前不再闪白底。
            - 桥接安装后业务入口 chunk 与原生事件注册并行加载。
            - 页面按需加载：入口 bundle 437 kB → 164 kB（未压缩），冷启动需解析的 JS 约少 27%。
            - 皮肤 / 披风补全、版本目录、内存读数等非首屏请求改到首个空闲帧。

            ### 修复
            - 主页「标题栏下一条空白带 + 启动按钮消失」：外壳改用 `fixed inset-0` 钉在视口上，
              不再受祖先高度链影响。

            ## 产物

            - **Windows**
              - `.exe`（NSIS）、`.msi`：x64 / x86 / arm64
              - `.msix`：x64 / x86 / arm64，**自签名**（每次构建生成新的开发证书，随包附 `.cer`；
                安装前需先信任证书。上架 Microsoft Store 时需把 Publisher 换成 Partner Center 的标识）
            - **Linux**：`.deb`（x86_64 / aarch64 / armv7l）、`.AppImage`（x86_64 / aarch64）
              - armv7l 为 x64 宿主交叉编译，只提供 `.deb`
            - **macOS**：`.dmg`（x86_64 / aarch64），**未签名**，首次打开需右键 →「打开」

            > Windows 安装包与 MSIX 均由本工作流构建；草稿状态需人工核对后再点「发布」。
