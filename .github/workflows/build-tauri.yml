name: build-tauri

# Linux / macOS 安装包由 GitHub 托管运行器构建（本机只有 Windows 工具链）。
# 触发：手动 workflow_dispatch，或推送 v* 标签（打标签时会额外创建 Draft Release 并附上全部产物）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 公开仓库可用的 arm64 托管运行器；若账号不可用会在此 job 失败，不影响 x64。
          - runner: ubuntu-22.04
            arch: x86_64
            bundles: deb,appimage
          - runner: ubuntu-24.04-arm
            arch: aarch64
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tauri.conf.json 的 beforeBuildCommand 会自行执行 npm run build:tauri:web。
      - name: 构建安装包
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: hcmcl-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # 未签名：用户首次打开需右键 →「打开」。公证需要 Apple 开发者证书，不在本仓库范围。
      - name: 构建安装包
        run: npx tauri build --bundles app,dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: hcmcl-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: src-tauri/target/release/bundle/dmg/*.dmg

  release:
    name: 汇总到 Draft Release
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**
          body: |
            由 `build-tauri` 工作流自动构建的 Linux / macOS 产物。

            - Linux：`.deb`、`.AppImage`（x86_64 / aarch64）
            - macOS：`.dmg`（x86_64 / aarch64），**未签名**，首次打开需右键 →「打开」

            Windows 安装包（x64 / arm64 / ia32）在本地构建后手动上传。
