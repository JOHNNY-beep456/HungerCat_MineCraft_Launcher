appId: com.hungercat.launcher
productName: HungerCat MineCraft Launcher
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: build/icon.png
    to: icon.png
# 最高压缩：仅影响安装包内的资源打包率（功能 / UI / 动画均不变），可显著减小安装包体积。
compression: maximum
mac:
  category: public.app-category.games
  target:
    - dmg
    - zip
  darkModeSupport: true
win:
  icon: build/icon.ico
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - AppImage
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: HungerCat MineCraft Launcher
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
