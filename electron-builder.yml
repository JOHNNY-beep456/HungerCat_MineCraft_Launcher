appId: com.hungercat.launcher
productName: HungerCat MineCraft Launcher
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# 只保留启动器实际支持的 3 种界面语言对应的 Chromium 语言包。
# Electron 自带 55 个 .pak 共 40.3 MB（全量），逐个平均 0.73 MB；
# 裁到 3 个只余 ~1.4 MB，单份运行时省 38.8 MB。
# 影响面仅为**原生**对话框与右键菜单：系统语言不在列表内时回落英文。
# 启动器自身界面全是自绘的，不受影响；日期/数字格式化走 icudtl.dat，也不受影响。
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
extraResources:
  - from: build/icon.png
    to: icon.png
  # 联机板块（MCTier 移植）所需的 EasyTier 内核。
  # 由 scripts/build-easytier-npcap-free.ps1 构建（无 Npcap）；不进 Git。
  # 只打包 core + cli：组网以 --no-tun 运行，不需要 wintun.dll / WinDivert64.sys；
  # 显式列出文件名，避免把调试用的 easytier-core.vendor/ 也带进安装包。
  # 运行时经 process.resourcesPath/easytier/ 定位。
  - from: resources/easytier
    to: easytier
    filter:
      - easytier-core.exe
      - easytier-cli.exe
      - easytier-core
      - easytier-cli
  # 原生下载内核（Rust → .node）。由 scripts/build-native-downloader.mjs 编译。
  # 必须放在 asar 之外：原生库无法从 asar 内 dlopen，只能作为普通文件加载。
  # 运行时经 process.resourcesPath/native/<platform>-<arch>/ 定位；
  # 缺失该平台产物时自动降级到 TS 下载器（见 src/main/native-downloader.ts）。
  - from: resources/native
    to: native
# 最高压缩：仅影响安装包内的资源打包率（功能 / UI / 动画均不变），可显著减小安装包体积。
compression: maximum
mac:
  category: public.app-category.games
  target:
    - dmg
    - zip
  darkModeSupport: true
win:
  icon: build/icon.ico
  # 两个目标并存，各有用途：
  #   portable 主产物 —— Setup.exe **就是启动器自身**（electron-builder 的 portable
  #     目标把应用封成单文件 exe）。主进程检测到 PORTABLE_EXECUTABLE_FILE 就切到
  #     安装模式（src/main/installer/），因此安装包里只有**一份** Electron 运行时。
  #     早前是把启动器当载荷塞进另一个 Electron 安装器，等于带了两份运行时
  #     （约 2 × 268 MB 未压缩），这是安装包体积的最大来源。
  #   nsis 应急兜底 —— electron-builder 自带的安装器，不依赖安装模式那条代码路径，
  #     万一便携包在实机上出问题，仍可出一条 100% 可靠的安装包。
  target:
    - portable
    - nsis
portable:
  artifactName: "HCMCL-${version} Setup.exe"
linux:
  icon: build/icon.png
  target:
    - AppImage
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: HungerCat MineCraft Launcher
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
