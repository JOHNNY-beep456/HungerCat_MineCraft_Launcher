appId: com.hungercat.launcher
productName: HungerCat MineCraft Launcher
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: build/icon.png
    to: icon.png
  # 联机板块（MCTier 移植）所需的 EasyTier 内核。
  # 由 scripts/build-easytier-npcap-free.ps1 构建（无 Npcap）；不进 Git。
  # 只打包 core + cli：组网以 --no-tun 运行，不需要 wintun.dll / WinDivert64.sys；
  # 显式列出文件名，避免把调试用的 easytier-core.vendor/ 也带进安装包。
  # 运行时经 process.resourcesPath/easytier/ 定位。
  - from: resources/easytier
    to: easytier
    filter:
      - easytier-core.exe
      - easytier-cli.exe
      - easytier-core
      - easytier-cli
  # 原生下载内核（Rust → .node）。由 scripts/build-native-downloader.mjs 编译。
  # 必须放在 asar 之外：原生库无法从 asar 内 dlopen，只能作为普通文件加载。
  # 运行时经 process.resourcesPath/native/<platform>-<arch>/ 定位；
  # 缺失该平台产物时自动降级到 TS 下载器（见 src/main/native-downloader.ts）。
  - from: resources/native
    to: native
# 最高压缩：仅影响安装包内的资源打包率（功能 / UI / 动画均不变），可显著减小安装包体积。
compression: maximum
mac:
  category: public.app-category.games
  target:
    - dmg
    - zip
  darkModeSupport: true
win:
  icon: build/icon.ico
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - AppImage
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: HungerCat MineCraft Launcher
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
