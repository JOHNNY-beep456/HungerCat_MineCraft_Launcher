<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <title>HungerCat MineCraft Launcher 安装程序</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>

    <header class="titlebar">
      <img class="tb-logo" src="assets/logo.png" alt="" />
      <div class="tb-text">
        <span class="tb-title">HungerCat MineCraft Launcher</span>
        <span class="tb-sub" id="tbVersion">安装程序</span>
      </div>
      <div class="tb-actions">
        <button class="tb-btn" id="btnMin" aria-label="最小化">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></svg>
        </button>
        <button class="tb-btn tb-btn-close" id="btnClose" aria-label="关闭">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></svg>
        </button>
      </div>
    </header>

    <main class="stage">
      <section class="step is-active" data-step="welcome">
        <div class="hero">
          <img class="hero-logo" src="assets/logo.png" alt="" />
          <h1 class="hero-title">欢迎使用安装向导</h1>
          <p class="hero-sub">即将安装 HungerCat MineCraft Launcher，请确认安装范围与安装位置。</p>
        </div>

        <div class="glass card">
          <div class="scopeGroup">
            <span class="row-label">安装范围</span>
            <div class="radios">
              <label class="radio"
                ><input type="radio" name="scope" value="all" /><span class="dot"></span
                ><span class="rtext">为所有用户安装（需要管理员权限）</span></label
              >
              <label class="radio"
                ><input type="radio" name="scope" value="user" checked /><span class="dot"></span
                ><span class="rtext">仅为当前用户安装（<b id="scopeUserName">—</b>）</span></label
              >
            </div>
          </div>

          <div class="divider"></div>

          <div class="row">
            <span class="row-label">安装目录</span>
            <div class="row-control">
              <input class="input" id="dirInput" type="text" readonly />
              <button class="btn btn-ghost" id="btnBrowse">浏览…</button>
            </div>
          </div>
          <div class="row">
            <span class="row-label">创建桌面快捷方式</span>
            <label class="switch"
              ><input type="checkbox" id="optDesktop" checked /><span class="track"><span class="knob"></span></span
            ></label>
          </div>
          <div class="row">
            <span class="row-label">创建开始菜单快捷方式</span>
            <label class="switch"
              ><input type="checkbox" id="optStartMenu" checked /><span class="track"><span class="knob"></span></span
            ></label>
          </div>

          <p class="hint" id="welcomeHint"></p>
        </div>

        <div class="actions">
          <button class="btn" id="btnCancelWelcome">取消</button>
          <button class="btn btn-primary" id="btnInstall">开始安装</button>
        </div>
      </section>

      <section class="step" data-step="installing">
        <div class="hero">
          <h1 class="hero-title">正在安装…</h1>
          <p class="hero-sub" id="installDetail">正在准备文件…</p>
        </div>
        <div class="glass card">
          <div class="progress"><span class="progress-fill" id="progressFill"></span></div>
          <div class="progress-meta">
            <span id="progressPhase">复制文件</span>
            <span id="progressPercent">0%</span>
          </div>
        </div>
        <div class="actions">
          <button class="btn" id="btnCancelInstall">取消安装</button>
        </div>
      </section>

      <section class="step" data-step="done">
        <div class="hero">
          <div class="badge badge-ok">✓</div>
          <h1 class="hero-title">安装完成</h1>
          <p class="hero-sub" id="doneScope">HungerCat MineCraft Launcher 已安装到你的电脑。</p>
        </div>
        <div class="glass card">
          <div class="row">
            <span class="row-label">安装位置</span>
            <span class="row-value" id="donePath">—</span>
          </div>
          <div class="row">
            <span class="row-label">立即启动</span>
            <label class="switch"
              ><input type="checkbox" id="optLaunch" checked /><span class="track"><span class="knob"></span></span
            ></label>
          </div>
        </div>
        <div class="actions">
          <button class="btn" id="btnOpenFolder">打开安装目录</button>
          <button class="btn btn-primary" id="btnFinish">完成</button>
        </div>
      </section>

      <section class="step" data-step="error">
        <div class="hero">
          <div class="badge badge-err">!</div>
          <h1 class="hero-title">安装失败</h1>
          <p class="hero-sub" id="errorText">—</p>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="btnBack">返回</button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
