# ============================================================================
#  【已停用 · 保留仅为回滚兜底】
#
#  安装模式已并入启动器（见 src/main/installer/），Setup.exe 现在就是启动器自身，
#  只带一份 Electron 运行时。本工程是早前那套「安装器套启动器」的双运行时方案，
#  体积约为新方案的两倍，现已不再由 scripts/build-installer.mjs 调用。
#
#  暂时保留是为了便携包在实机验证通过之前有退路：确认新版安装包稳定后，
#  连同 installer/main.js、installer/preload.js、installer/renderer/ 一并删除。
# ============================================================================
appId: com.hungercat.installer
productName: HungerCat Installer
copyright: Copyright © Hunger Cat
directories:
  # 安装器产物与启动器产物分开，避免相互覆盖。
  output: ../release/installer
  buildResources: build
files:
  - main.js
  - preload.js
  - renderer/**
  - package.json
# 复用根工程已下载的 Electron，避免为安装器再拉一份。
electronVersion: 33.4.11
electronDist: ../node_modules/electron/dist
# 安装器界面只有简体中文一种语言，Chromium 语言包只需留 zh-CN 与 en-US
# （en-US 兜底原生对话框）——与根工程同样的裁剪，省约 39 MB 未压缩。
# 注意：本工程的 payload 是整个启动器目录，那一份的语言包由**根工程**的
# electronLanguages 负责裁剪，两边各管自己那份。
electronLanguages:
  - zh-CN
  - en-US
# 最高压缩：仅影响安装包内的资源打包率（界面 / 流程均不变）。
# 根工程早已是 maximum，本工程原先漏了（默认 normal）。
compression: maximum
# 内置载荷：打包后的启动器目录（构建脚本在打包前复制到 installer/payload）。
# 运行时经 process.resourcesPath/payload 读取；不进 Git。
extraResources:
  - from: payload
    to: payload
win:
  icon: build/icon.ico
  # 按用户安装（写入 LocalAppData 与 HKCU），不需要管理员提权。
  requestedExecutionLevel: asInvoker
  target:
    - portable
portable:
  artifactName: "HCMCL-${version} Setup.exe"
